name: Build iOS IPA

on:
  # 手动触发（Actions 页面点 Run workflow）
  workflow_dispatch:
  # 推送 tag（如 v1.0.0）时自动构建，并在 Release 附上 IPA
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15          # 自带 Xcode 16+，兼容新工程格式(objectVersion 77)
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          # 自动选择 runner 上最新的 Xcode，避免固定版本与工程格式不兼容
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la
          xcodebuild -list -project MarketTabs.xcodeproj
          echo "PROJECT_NAME=MarketTabs" >> "$GITHUB_ENV"

      - name: Build archive (unsigned)
        run: |
          set -euo pipefail
          PROJECT="${PROJECT_NAME}.xcodeproj"
          SCHEME="${PROJECT_NAME}"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/${SCHEME}.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcpretty

      - name: Package IPA (Payload)
        run: |
          set -euo pipefail
          SCHEME="${PROJECT_NAME}"
          mkdir -p "build/Payload"
          cp -r "build/${SCHEME}.xcarchive/Products/Applications/"*.app "build/Payload/"
          cd build
          zip -qry "${SCHEME}-unsigned.ipa" Payload
          cd ..
          ls -la build/*.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketTabs-unsigned-ipa
          path: build/*.ipa
          retention-days: 30
          if-no-files-found: error

      # 仅打 tag 时创建 Release 并附上 IPA
      - name: Create Release with IPA
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
